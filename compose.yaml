version: '3.8'

services:
  db:
    image: postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD

  adminer:
    image: adminer
    restart: always
    ports:
      - '8082:8080'

  leasing:
    build: .
    ports:
      - '8080:8080'
    links:
      - db
    depends_on:
      - db
      - adminer
    environment:
      - SPRING_PROFILES_ACTIVE
      - POSTGRES_URL
      - POSTGRES_PORT
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD