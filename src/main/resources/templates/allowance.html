<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>HAKEDİŞ DETAYI</title>

    <!-- Favicon -->
    <link rel="icon" href="./images/favicon.png" type="image/x-icon" />

    <!-- Invoice styling -->
    <style>
        body.allowance-body {
            font-family: 'Helvetica Neue', 'Helvetica', Helvetica, Arial, sans-serif;
            text-align: center;
            color: #777;
        }

        body.allowance-body h1 {
            font-weight: 300;
            margin-bottom: 0px;
            padding-bottom: 0px;
            color: #000;
        }

        body.allowance-body h3 {
            font-weight: 300;
            margin-top: 10px;
            margin-bottom: 20px;
            font-style: italic;
            color: #555;
        }

        body.allowance-body a {
            color: #06f;
        }

        .invoice-box {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border: 1px solid #eee;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            font-size: 16px;
            line-height: 24px;
            font-family: 'Helvetica Neue', 'Helvetica', Helvetica, Arial, sans-serif;
            color: #555;
        }

        .invoice-box table {
            width: 100%;
            line-height: inherit;
            text-align: left;
            border-collapse: collapse;
        }

        .invoice-box table td {
            padding: 5px;
            vertical-align: top;
        }

        .invoice-box table tr td:nth-child(2) {
            text-align: right;
        }

        .invoice-box table tr.top table td {
            padding-bottom: 20px;
        }

        .invoice-box table tr.top table td.title {
            font-size: 45px;
            line-height: 45px;
            color: #333;
        }

        .invoice-box table tr.top table td.dates {
            text-align: right;
        }

        .invoice-box table tr.information table td {
            padding-bottom: 40px;
        }

        .invoice-box table tr.heading td {
            background: #eee;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        .invoice-box table tr.details td {
            padding-bottom: 20px;
        }

        .invoice-box table tr.item td {
            border-bottom: 1px solid #eee;
        }

        .invoice-box table tr.item.last td {
            border-bottom: none;
        }

        .invoice-box table tr.total td:nth-child(2) {
            border-top: 2px solid #eee;
            font-weight: bold;
        }

        @media only screen and (max-width: 600px) {
            .invoice-box table tr.top table td {
                width: 100%;
                display: block;
                text-align: center;
            }

            .invoice-box table tr.information table td {
                width: 100%;
                display: block;
                text-align: center;
            }
        }
    </style>
</head>

<body class="allowance-body">

<div class="invoice-box">
    <table>
        <tr class="top">
            <td colspan="4">
                <table>
                    <tr>
                        <td class="title">
                            <img th:src="${allowance.logo}" th:alt="${allowance.dealerTitle}" style="width: 100%; max-width: 300px" />
                        </td>

                        <td></td>
                        <td></td>

                        <td class="dates">
                            Hakediş Seri No: <span th:text="${allowance.serialNumber}"></span><br />
                            Oluşturulma Tarihi: <span th:text="${allowance.date}"></span><br />
                            Zaman Aralığı: <span th:text="${allowance.startTime}"></span>/<span th:text="${allowance.endTime}"></span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr class="information">
            <td colspan="4">
                <table>
                    <tr>
                        <td>
                            <span th:text="${allowance.dealerTitle}"></span><br />
                            <span th:text="${allowance.dealerAddress}"></span><br />
                            <span th:text="${allowance.dealerPhoneNumber}"></span><br />
                            <span th:text="${allowance.dealerEmail}"></span>
                        </td>

                        <td>
                            <span th:text="${allowance.customerTitle}"></span><br />
                            <span th:text="${allowance.customerAddress}"></span><br />
                            <span th:text="${allowance.customerPhoneNumber}"></span><br />
                            <span th:text="${allowance.customerEmail}"></span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr class="heading">
            <td>Koşullar</td>
            <td></td>
            <td></td>
            <td>#</td>
        </tr>

        <tr class="details" th:each="condition : ${allowance.conditions}">
            <td><span th:text="${condition.name}"></span></td>
            <td></td>
            <td></td>
            <td><span th:text="${condition.value}"></span></td>
        </tr>

        <tr class="heading">
            <td>Kiralama Hareketleri</td>
            <td>Hareket Tipi</td>
            <td>Zaman</td>
            <td>Miktar</td>
        </tr>

        <tr class="item" th:each="transaction : ${allowance.transactions}">
            <td><span th:text="${transaction.productName}"></span></td>
            <td><span th:text="${transaction.type}"></span></td>
            <td><span th:text="${transaction.issueDate}"></span></td>
            <td><span th:text="${transaction.amount}"></span></td>
        </tr>

        <tr class="total">
            <td></td>
            <td></td>
            <td></td>
            <td>Toplam: <span th:text="${allowance.totalAmount}"></span></td>
        </tr>
    </table>
</div>
</body>
</html>
