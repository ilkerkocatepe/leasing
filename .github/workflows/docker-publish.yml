  name: build and deploy leasing
  on:
    push:
      branches:
        - main

  jobs:
    build-deploy:
      name: build and deploy leasing
      runs-on: ubuntu-22.04
      steps:
        - name: checkout code
          uses: actions/checkout@v3

        - name: setup jdk 21
          uses: actions/setup-java@v3
          with:
            distribution: 'corretto'
            java-version: 21

        - name: build the app
          run: |
            mvn clean -DskipTests
            mvn -DskipTests -B package --file pom.xml
        - name: build the docker image
          uses: docker/build-push-action@v4
          with:
            context: .
            dockerfile: Dockerfile
            push: false
            tags: ${{ secrets.DOCKER_REGISTRY_HOST }}/leasing:latest

        - name: login to private registry
          uses: docker/login-action@v3
          with:
            registry: ${{ secrets.DOCKER_REGISTRY_HOST }}
            username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
            password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

        - name: push the docker image to docker hub
          uses: docker/build-push-action@v4
          with:
            context: .
            dockerfile: Dockerfile
            push: true
            tags: ilkerkocatepe/leasing:latest

        - name: Deploy to VPS
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.VPS_IP }}
            username: ${{ secrets.VPS_USER }}
            password: ${{ secrets.VPS_PASSWORD }}
            script: |
              docker pull ilkerkocatepe/leasing:latest
              cd /opt/docker/leasing-backend
              docker-compose up -d --build
